name: Testes dos Microsservicos
on: [push, pull_request]
jobs:
  testar-servicos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [servico-usuarios, servico-inventario, servico-chamados, servico-notificacoes, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: ${{ matrix.servico }}
        run: pip install -r requirements.txt pytest
      - working-directory: ${{ matrix.servico }}
        env:
          JWT_SEGREDO: segredo-de-testes-ci-helpdesk-microsservicos-2026
        run: python -m pytest -v
